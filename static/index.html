<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c6af7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Ithaca</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.18.0/cdn/themes/dark.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.18.0/cdn/shoelace-autoloader.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark-dimmed.min.css">
</head>
<body>
<div id="app">
  <header>
    <span class="wordmark">◈ Ithaca</span>
    <div class="header-actions">
      <sl-button size="small" variant="text" id="agent-btn">🤖 Agent</sl-button>
      <sl-button size="small" variant="text" id="research-btn">🔬 Research</sl-button>
      <sl-button size="small" variant="text" id="compare-btn">⚖️ Compare</sl-button>
      <sl-button size="small" variant="text" id="docs-btn">📄 Docs</sl-button>
      <sl-button size="small" variant="text" id="memory-btn">🧠 Memory</sl-button>
      <sl-button size="small" variant="text" id="cookbook-btn">📦 Cookbook</sl-button>
      <sl-button size="small" variant="text" id="productivity-btn">📋 Tasks</sl-button>
      <sl-button size="small" variant="text" id="settings-btn">⚙ Settings</sl-button>
      <form method="post" action="/logout" style="margin:0">
        <sl-button size="small" variant="text" type="submit" style="color:var(--danger)">Sign out</sl-button>
      </form>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Chats</span>
        <sl-icon-button name="plus-lg" id="new-chat" label="New chat"></sl-icon-button>
      </div>
      <ul id="session-list"></ul>
    </aside>
    <main id="main">
      <div id="chat-container" class="hidden">
        <div id="messages"></div>
        <div id="input-area">
          <sl-textarea id="chat-input" placeholder="Message Ithaca..." rows="1" resize="auto" size="medium"></sl-textarea>
          <sl-icon-button name="send" id="send-btn" label="Send" style="font-size:1.4rem;color:var(--accent)"></sl-icon-button>
        </div>
      </div>
      <div id="empty-state" class="empty-state">
        <p>Start a new chat to begin.</p>
      </div>
    </main>
  </div>
</div>

<!-- Settings dialog -->
<sl-dialog label="Settings" id="settings-modal" style="--width:480px">
  <div class="modal-body">
    <label>Provider</label>
    <sl-select id="provider-select" size="small"></sl-select>
    <label>Model</label>
    <sl-select id="model-select" size="small"></sl-select>
    <sl-divider></sl-divider>
    <h3>Manage Providers</h3>
    <div id="provider-list"></div>
    <div class="add-provider">
      <sl-input id="prov-name" placeholder="Name" size="small"></sl-input>
      <sl-input id="prov-url" placeholder="Base URL" size="small"></sl-input>
      <sl-input id="prov-key" placeholder="API Key (optional)" size="small" type="password"></sl-input>
      <sl-button size="small" variant="default" id="add-provider-btn">Add Provider</sl-button>
    </div>
  </div>
  <sl-button slot="footer" variant="primary" id="close-settings">Done</sl-button>
</sl-dialog>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js"></script>
<script src="/static/js/markdown.js"></script>
<script src="/static/js/sessions.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/compare.js"></script>
<script src="/static/js/research.js"></script>
<script src="/static/js/agent.js"></script>
<script src="/static/js/documents.js"></script>
<script src="/static/js/memory.js"></script>
<script src="/static/js/cookbook.js"></script>
<script src="/static/js/productivity.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');</script>
</body>
</html>
