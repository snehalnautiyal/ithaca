<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ithaca</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark-dimmed.min.css">
</head>
<body>
<div id="app">
  <header>
    <span class="wordmark">◈ Ithaca</span>
    <div class="header-actions">
      <button class="btn-ghost" id="agent-btn">🤖 Agent</button>
      <button class="btn-ghost" id="research-btn">🔬 Research</button>
      <button class="btn-ghost" id="docs-btn">📄 Docs</button>
      <button class="btn-ghost" id="memory-btn">🧠 Memory</button>
      <button class="btn-ghost" id="settings-btn">⚙ Settings</button>
      <form method="post" action="/logout" style="margin:0">
        <button class="btn-ghost" type="submit">Sign out</button>
      </form>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Chats</span>
        <button class="btn-icon" id="new-chat" title="New chat">＋</button>
      </div>
      <ul id="session-list"></ul>
    </aside>
    <main id="main">
      <div id="chat-container" class="hidden">
        <div id="messages"></div>
        <div id="input-area">
          <textarea id="chat-input" placeholder="Message Ithaca..." rows="1"></textarea>
          <button id="send-btn" title="Send">➤</button>
        </div>
      </div>
      <div id="empty-state" class="empty-state">
        <p>Start a new chat to begin.</p>
      </div>
    </main>
  </div>
</div>

<!-- Settings modal -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="btn-icon" id="close-settings">✕</button>
    </div>
    <div class="modal-body">
      <label>Provider</label>
      <select id="provider-select"></select>
      <label>Model</label>
      <select id="model-select"></select>
      <hr>
      <h3>Manage Providers</h3>
      <div id="provider-list"></div>
      <div class="add-provider">
        <input id="prov-name" placeholder="Name">
        <input id="prov-url" placeholder="Base URL">
        <input id="prov-key" placeholder="API Key (optional)">
        <button class="btn-ghost" id="add-provider-btn">Add</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js"></script>
<script src="/static/js/markdown.js"></script>
<script src="/static/js/sessions.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/research.js"></script>
<script src="/static/js/agent.js"></script>
<script src="/static/js/documents.js"></script>
<script src="/static/js/memory.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
